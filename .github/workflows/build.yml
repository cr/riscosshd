name: build
# Every push to main and every pull request builds and tests.  A tag
# v<version> also publishes: the package goes to a GitHub release and the
# PackMan index to GitHub Pages, https://cr.github.io/riscosshd/pkg/index
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request makes an older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Actions are pinned by commit; .github/dependabot.yml keeps the pins current.
jobs:
  riscos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0              # tags, for git describe and the version check
      - name: Warn when the Control version is already released
        if: github.ref == 'refs/heads/main'
        run: |
          v=$(sed -n 's/^Version: *//p' riscos/RiscPkg/Control)
          if t=$(git rev-parse -q --verify "refs/tags/v$v^{commit}") && [ "$t" != "$GITHUB_SHA" ]; then
            echo "::warning::Control says $v, which is already released as v$v: bump the version before the next release"
          fi
      - name: Check that a release tag matches the Control file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^Version: *//p' riscos/RiscPkg/Control)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but Control says $v"; exit 1; }
      - name: Host-side unit test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssh-dev pkg-config && make check
      - name: Toolchain image
        # A plain build: the base is pinned by digest and pulls quickly on
        # hosted runners; a buildx layer cache made the job slower.
        run: docker build --platform linux/amd64 -t riscosshd-gccsdk docker
      - name: Cache cross-built dependencies
        # not for releases: a tag builds everything from the pinned sources
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/sysroot
          key: deps-${{ hashFiles('tools/build-deps.sh', 'deps/mbedtls_riscos_config.h', 'deps/patches/**', 'deps/riscos-compat/**', 'cmake/toolchain-riscos.cmake', 'docker/Dockerfile') }}
      - name: Mark the image and a restored sysroot as up to date
        run: |
          touch .image-built
          test -d deps/sysroot && find deps/sysroot -exec touch {} + || true
      - name: Build (dependencies, server, package)
        run: make ENGINE=docker WERROR=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SSHd
          path: dist/SSHd_*.zip

  release:
    needs: riscos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SSHd
          path: dist
      - name: Release notes from CHANGELOG.md, package index
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          printf '\nPackMan source (add under Sources): %s/pkg/index\n' "$site" >> notes.md
          sh tools/mkindex.sh site "$site" dist/SSHd_*.zip
      # Pages first: the index is self-contained, and the release step below
      # can then be re-run on its own if it fails.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" dist/SSHd_*.zip --verify-tag \
                --title "SSHd ${GITHUB_REF_NAME#v}" --notes-file notes.md
