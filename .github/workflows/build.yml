name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  riscos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cross-built dependencies
        uses: actions/cache@v4
        with:
          path: deps/sysroot
          key: deps-${{ hashFiles('tools/build-deps.sh', 'deps/mbedtls_riscos_config.h', 'deps/patches/**', 'deps/riscos-compat/**', 'cmake/toolchain-riscos.cmake') }}
      - name: Build (image, dependencies, server, package)
        run: make ENGINE=docker
      - uses: actions/upload-artifact@v4
        with:
          name: SSHd
          path: dist/SSHd_*.zip
