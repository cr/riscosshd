name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  riscos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cross-built dependencies
        uses: actions/cache@v4
        with:
          path: deps/sysroot
          key: deps-${{ hashFiles('tools/build-deps.sh', 'deps/mbedtls_riscos_config.h', 'deps/patches/**', 'cmake/toolchain-riscos.cmake') }}
      - name: Build GCCSDK image
        run: docker build --platform linux/amd64 -t riscosshd-gccsdk docker
      - name: Build
        run: docker run --rm --platform linux/amd64 -v "$PWD:/work" -w /work riscosshd-gccsdk sh tools/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SSHd
          path: build/SSHd.zip
