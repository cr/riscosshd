name: build
# Every push to main and every pull request builds and tests.  A tag
# v<version> also publishes: the package goes to a GitHub release and the
# PackMan index to GitHub Pages, https://cr.github.io/riscosshd/pkg/index
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  riscos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that a release tag matches the Control file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^Version: *//p' riscos/RiscPkg/Control)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but Control says $v"; exit 1; }
      - name: Host-side unit test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssh-dev pkg-config && make check
      - name: Toolchain image
        # A plain build: the base is pinned by digest and pulls quickly on
        # hosted runners; a buildx layer cache made the job slower.
        run: docker build --platform linux/amd64 -t riscosshd-gccsdk docker
      - name: Cache cross-built dependencies
        uses: actions/cache@v4
        with:
          path: deps/sysroot
          key: deps-${{ hashFiles('tools/build-deps.sh', 'deps/mbedtls_riscos_config.h', 'deps/patches/**', 'deps/riscos-compat/**', 'cmake/toolchain-riscos.cmake', 'docker/Dockerfile') }}
      - name: Mark the image and a restored sysroot as up to date
        run: |
          touch .image-built
          test -d deps/sysroot && find deps/sysroot -exec touch {} + || true
      - name: Build (dependencies, server, package)
        run: make ENGINE=docker WERROR=1
      - uses: actions/upload-artifact@v4
        with:
          name: SSHd
          path: dist/SSHd_*.zip

  release:
    needs: riscos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SSHd
          path: dist
      - name: Package index, GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          sh tools/mkindex.sh site "$site" dist/SSHd_*.zip
          gh release create "${GITHUB_REF_NAME}" dist/SSHd_*.zip \
              --title "SSHd ${GITHUB_REF_NAME#v}" \
              --notes "PackMan source (add under Sources): $site/pkg/index"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
